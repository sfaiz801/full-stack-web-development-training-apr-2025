<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #ffffff;
        }

        .todo-card {
            width: 100%;
            max-width: 480px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .title-area h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .title-area p {
            font-size: 0.82rem;
            color: #8b949e;
            margin-top: 2px;
        }

        .badge-count {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .input-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .task-input {
            flex: 1;
            padding: 13px 18px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .task-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .add-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: #ffffff;
            width: 50px;
            border-radius: 14px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .add-btn:hover {
            transform: scale(1.05);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .task-list::-webkit-scrollbar {
            width: 5px;
        }
        .task-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .checkbox-custom {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .task-item.completed .checkbox-custom {
            background: #10b981;
            border-color: #10b981;
        }

        .task-item.completed .checkbox-custom i {
            display: block;
            color: #ffffff;
            font-size: 0.75rem;
        }

        .checkbox-custom i {
            display: none;
        }

        .task-text {
            font-size: 0.95rem;
            color: #e6edf3;
            transition: all 0.2s;
            word-break: break-word;
        }

        .task-item.completed .task-text {
            color: #6e7681;
            text-decoration: line-through;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #6e7681;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .delete-btn:hover {
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.1);
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
            color: #8b949e;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: #818cf8;
            cursor: pointer;
            font-weight: 600;
        }

        .clear-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="todo-card">
        <div class="header">
            <div class="title-area">
                <h2>Daily Goals 🎯</h2>
                <p id="today-date">Today's Tasks</p>
            </div>
            <div class="badge-count" id="pending-count">0 Remaining</div>
        </div>

        <div class="input-bar">
            <input type="text" id="new-task-input" class="task-input" placeholder="What needs to be done?">
            <button class="add-btn" onclick="addTask()">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <ul class="task-list" id="tasks-container">
            <!-- Dynamic tasks go here -->
        </ul>

        <div class="footer-controls">
            <span id="completed-stats">0 completed</span>
            <button class="clear-btn" onclick="clearCompleted()">Clear Done</button>
        </div>
    </div>

    <script>
        let tasks = [
            { id: 1, text: "Revise Python data structures", completed: true },
            { id: 2, text: "Build modern HTML & CSS components", completed: false },
            { id: 3, text: "Commit progress to GitHub repo", completed: false }
        ];

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="task-left" onclick="toggleTask(${task.id})">
                        <div class="checkbox-custom">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <span class="task-text">${task.text}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(li);
            });

            const pending = tasks.filter(t => !t.completed).length;
            const completed = tasks.filter(t => t.completed).length;
            document.getElementById('pending-count').innerText = `${pending} Remaining`;
            document.getElementById('completed-stats').innerText = `${completed} completed`;
        }

        function addTask() {
            const input = document.getElementById('new-task-input');
            const val = input.value.trim();
            if (!val) return;

            tasks.push({
                id: Date.now(),
                text: val,
                completed: false
            });
            input.value = '';
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            renderTasks();
        }

        document.getElementById('new-task-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        // Set date string
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        document.getElementById('today-date').innerText = new Date().toLocaleDateString(undefined, options);

        renderTasks();
    </script>
</body>
</html>
