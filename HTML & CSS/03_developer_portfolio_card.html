<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Developer Portfolio Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            padding: 20px;
        }

        .profile-card {
            width: 380px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px -10px rgba(99, 102, 241, 0.3);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .cover-banner {
            height: 120px;
            background: linear-gradient(135deg, #6366f1, #ec4899, #8b5cf6);
            position: relative;
        }

        .avatar-wrapper {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            background: #0b0f19;
            padding: 4px;
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #3b82f6, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 18px;
            height: 18px;
            background: #10b981;
            border-radius: 50%;
            border: 3px solid #111827;
        }

        .card-body {
            padding: 65px 24px 30px;
            text-align: center;
            color: #ffffff;
        }

        .user-name {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .user-title {
            font-size: 0.9rem;
            color: #818cf8;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .user-bio {
            font-size: 0.88rem;
            color: #9ca3af;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #cbd5e1;
            transition: all 0.2s;
        }

        .skill-tag:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #ffffff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 16px 0;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 22px;
        }

        .stat-item h4 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #f3f4f6;
        }

        .stat-item p {
            font-size: 0.72rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .action-btns {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            box-shadow: 0 10px 22px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #e5e7eb;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="cover-banner">
            <div class="avatar-wrapper">
                <div class="avatar-img">
                    <i class="fa-solid fa-code"></i>
                </div>
                <div class="status-dot" title="Available for work"></div>
            </div>
        </div>

        <div class="card-body">
            <h2 class="user-name">Faiz Siddiqui</h2>
            <div class="user-title">
                <i class="fa-solid fa-bolt"></i> Full Stack Developer
            </div>
            <p class="user-bio">
                Passionate about crafting fast, modern web applications, scalable backends, and pixel-perfect responsive user interfaces.
            </p>

            <div class="skills-container">
                <span class="skill-tag">HTML5 & CSS3</span>
                <span class="skill-tag">JavaScript ES6</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">React.js</span>
                <span class="skill-tag">Node.js</span>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <h4>45+</h4>
                    <p>Projects</p>
                </div>
                <div class="stat-item">
                    <h4>3+</h4>
                    <p>Years Exp</p>
                </div>
                <div class="stat-item">
                    <h4>99%</h4>
                    <p>Satisfaction</p>
                </div>
            </div>

            <div class="action-btns">
                <button class="btn btn-primary">
                    <i class="fa-solid fa-paper-plane"></i> Hire Me
                </button>
                <button class="btn btn-secondary">
                    <i class="fa-solid fa-download"></i> Resume
                </button>
            </div>
        </div>
    </div>

</body>
</html>
