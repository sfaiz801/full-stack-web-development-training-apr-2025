<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 03: Modern HTML5 Forms & Client-Side Validation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem 1rem; line-height: 1.5; }
        .container { max-width: 700px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; }
        
        form { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 1.5rem; }
        fieldset { border: 1px solid #475569; border-radius: 8px; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
        legend { font-weight: 600; color: #818cf8; padding: 0 0.5rem; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-size: 0.9rem; font-weight: 500; color: #cbd5e1; }
        
        input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
            background: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 0.65rem 0.85rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        input:invalid:not(:placeholder-shown) { border-color: #f43f5e; }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
        
        .radio-group, .checkbox-group { display: flex; gap: 1.5rem; align-items: center; margin-top: 0.25rem; }
        .radio-item, .checkbox-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; }
        
        button[type="submit"] {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            font-weight: 700;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s, transform 0.1s;
        }
        button[type="submit"]:hover { opacity: 0.95; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Module 03: HTML5 Forms & Validation</h1>
            <p class="subtitle">Complete field controls, native validation constraints, and accessible fieldsets.</p>
        </header>

        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Form successfully validated!');">
            <!-- PERSONAL INFORMATION -->
            <fieldset>
                <legend>Personal & Account Details</legend>
                <div class="row">
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" placeholder="e.g. Mohammad Faiz" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="faiz@example.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="password">Password (Min 8 characters) *</label>
                        <input type="password" id="password" name="password" required minlength="8" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob">
                    </div>
                </div>
            </fieldset>

            <!-- PREFERENCES & SELECTORS -->
            <fieldset>
                <legend>Training Preferences</legend>
                <div class="form-group">
                    <label for="track">Primary Learning Track *</label>
                    <select id="track" name="track" required>
                        <option value="" disabled selected>-- Select a specialisation --</option>
                        <option value="fsd">Full Stack Web Development (Next.js + Python)</option>
                        <option value="frontend">Frontend Engineering (React + TypeScript)</option>
                        <option value="backend">Backend Engineering (FastAPI + SQL)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Preferred Batch Schedule:</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" name="batch" value="morning" checked> Morning (9 AM)</label>
                        <label class="radio-item"><input type="radio" name="batch" value="evening"> Evening (6 PM)</label>
                        <label class="radio-item"><input type="radio" name="batch" value="weekend"> Weekend Intensive</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Short Statement of Purpose</label>
                    <textarea id="bio" name="bio" rows="3" placeholder="Tell us about your learning goals..."></textarea>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" name="terms" required> I agree to the training code of conduct *</label>
                </div>
            </fieldset>

            <button type="submit">Submit Registration Form &rarr;</button>
        </form>
    </div>
</body>
</html>
