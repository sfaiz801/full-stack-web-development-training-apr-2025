<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Interactive Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border-radius: 1rem; overflow: hidden; box-shadow: 0 1rem 3rem rgba(0,0,0,0.2); }
        .bg-image { background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=800&auto=format&fit=crop'); background-size: cover; background-position: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card login-card border-0">
                    <div class="row g-0">
                        <!-- Image Side -->
                        <div class="col-md-6 bg-image d-none d-md-block"></div>
                        
                        <!-- Form Side -->
                        <div class="col-md-6 p-4 p-lg-5 bg-white">
                            <div class="text-center mb-4">
                                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                                    <i class="fa-solid fa-lock fa-2x"></i>
                                </div>
                                <h2>Welcome Back</h2>
                                <p class="text-muted">Please login to your account</p>
                            </div>

                            <form class="needs-validation" novalidate>
                                <!-- Email Floating Label -->
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                                    <label for="emailInput">Email address</label>
                                    <div class="invalid-feedback">
                                        Please enter a valid email address.
                                    </div>
                                </div>

                                <!-- Password Floating Label -->
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="passwordInput" placeholder="Password" required minlength="6">
                                    <label for="passwordInput">Password</label>
                                    <div class="invalid-feedback">
                                        Password must be at least 6 characters long.
                                    </div>
                                </div>

                                <!-- Options Row -->
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe">
                                        <label class="form-check-label text-muted" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>
                                    <a href="#" class="text-primary text-decoration-none" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot Password?</a>
                                </div>

                                <!-- Submit Button -->
                                <button class="btn btn-primary w-100 py-3 rounded-pill fw-bold" type="submit">Login</button>
                                
                                <!-- Divider -->
                                <div class="d-flex align-items-center my-4">
                                    <hr class="flex-grow-1">
                                    <span class="mx-3 text-muted">OR</span>
                                    <hr class="flex-grow-1">
                                </div>

                                <!-- Social Login -->
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-outline-danger w-50 py-2"><i class="fa-brands fa-google me-2"></i>Google</button>
                                    <button type="button" class="btn btn-outline-dark w-50 py-2"><i class="fa-brands fa-github me-2"></i>GitHub</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 p-md-5 text-center">
                    <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
                        <i class="fa-solid fa-envelope-open-text fa-3x text-primary"></i>
                    </div>
                    <h3 class="mb-3" id="forgotPasswordModalLabel">Reset Password</h3>
                    <p class="text-muted mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                    <div class="form-floating mb-4 text-start">
                        <input type="email" class="form-control" id="resetEmail" placeholder="name@example.com">
                        <label for="resetEmail">Email address</label>
                    </div>
                    <button type="button" class="btn btn-primary w-100 py-3 rounded-pill">Send Reset Link</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (() => {
        'use strict'

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        const forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
            }, false)
        })
        })()
    </script>
</body>
</html>
