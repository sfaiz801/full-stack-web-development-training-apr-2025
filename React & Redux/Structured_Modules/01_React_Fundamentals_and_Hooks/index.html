<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 01: React Fundamentals & Hooks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f8fafc; padding: 2.5rem 1rem; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
        header { text-align: center; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; background: rgba(56,189,248,0.15); color: #38bdf8; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.25rem; color: #818cf8; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .btn { background: linear-gradient(135deg, #38bdf8, #818cf8); border: none; color: #0b0f19; font-weight: 700; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; transition: transform 0.2s; margin-right: 0.5rem; margin-top: 0.5rem; }
        .btn:hover { transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
        .metric-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; }
        input[type="text"] { background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 0.6rem 1rem; border-radius: 8px; width: 100%; margin-top: 0.5rem; outline: none; }
        input:focus { border-color: #38bdf8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 1. Functional Component with Props & Children
        function StudentCard({ name, track, score, children }) {
            return (
                <div className="metric-box">
                    <h3 style={{ color: '#38bdf8', fontSize: '1.1rem' }}>{name}</h3>
                    <p style={{ color: '#94a3b8', fontSize: '0.9rem' }}>Track: {track} | Score: <strong style={{ color: '#34d399' }}>{score}%</strong></p>
                    {children && <div style={{ marginTop: '0.5rem', fontSize: '0.85rem', color: '#cbd5e1' }}>{children}</div>}
                </div>
            );
        }

        // 2. Main Interactive App demonstrating State, Effect & Ref
        function App() {
            // useState: Counter state
            const [count, setCount] = useState(0);
            
            // useEffect: Live timer with cleanup
            const [secondsActive, setSecondsActive] = useState(0);
            useEffect(() => {
                const interval = setInterval(() => {
                    setSecondsActive(prev => prev + 1);
                }, 1000);
                return () => clearInterval(interval); // Cleanup on unmount
            }, []);

            // useRef: Direct DOM access without re-renders
            const inputRef = useRef(null);
            const focusInput = () => {
                if (inputRef.current) {
                    inputRef.current.focus();
                    inputRef.current.style.borderColor = '#818cf8';
                }
            };

            return (
                <div className="container">
                    <header>
                        <span className="badge">Module 01</span>
                        <h1>React Fundamentals, JSX &amp; Core Hooks</h1>
                        <p className="subtitle">Interactive demonstration of Functional Components, Props, useState, useEffect cleanup, and useRef.</p>
                    </header>

                    {/* 1. STATE & HOOKS */}
                    <div className="card">
                        <h2>1. Reactive State (`useState`) &amp; Side-Effects (`useEffect`)</h2>
                        <div className="grid-2">
                            <div className="metric-box">
                                <span style={{ color: '#94a3b8', fontSize: '0.85rem' }}>STATE COUNTER</span>
                                <h3 style={{ fontSize: '2rem', color: '#38bdf8' }}>{count}</h3>
                                <div>
                                    <button className="btn" onClick={() => setCount(prev => prev + 1)}>Increment (+1)</button>
                                    <button className="btn btn-outline" onClick={() => setCount(0)}>Reset</button>
                                </div>
                            </div>

                            <div className="metric-box">
                                <span style={{ color: '#94a3b8', fontSize: '0.85rem' }}>ACTIVE SESSION TIMER (useEffect)</span>
                                <h3 style={{ fontSize: '2rem', color: '#34d399' }}>{secondsActive}s</h3>
                                <p style={{ color: '#94a3b8', fontSize: '0.85rem' }}>Interval handled cleanly via `useEffect` with automatic `clearInterval` unmount.</p>
                            </div>
                        </div>
                    </div>

                    {/* 2. PROPS & COMPONENT COMPOSITION */}
                    <div className="card">
                        <h2>2. Component Architecture &amp; Dynamic Props</h2>
                        <div className="grid-2">
                            <StudentCard name="Mohammad Faiz" track="Full Stack Engineering" score={96}>
                                <span>Status: <span style={{ color: '#38bdf8' }}>Active Learner</span></span>
                            </StudentCard>
                            <StudentCard name="Amina Khan" track="Frontend Architecture" score={92}>
                                <span>Status: <span style={{ color: '#a78bfa' }}>Sprint Review Complete</span></span>
                            </StudentCard>
                        </div>
                    </div>

                    {/* 3. DOM ACCESS VIA useRef */}
                    <div className="card">
                        <h2>3. Imperative DOM Access (`useRef`)</h2>
                        <p style={{ color: '#94a3b8', fontSize: '0.9rem' }}>useRef holds mutable references across renders without triggering a re-render cycle.</p>
                        <input ref={inputRef} type="text" placeholder="Click the button below to focus this input element programmatically..." />
                        <button className="btn" onClick={focusInput} style={{ marginTop: '0.75rem' }}>Focus Input with useRef</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
