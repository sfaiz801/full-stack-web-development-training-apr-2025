<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 04: Redux Selectors, Middleware & Async Thunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <!-- React, ReactDOM, Redux, Redux-Toolkit, React-Redux, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@reduxjs/toolkit@1.9.5/dist/redux-toolkit.umd.js"></script>
    <script src="https://unpkg.com/react-redux@8.1.1/dist/react-redux.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f8fafc; padding: 2.5rem 1rem; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
        header { text-align: center; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; background: rgba(56,189,248,0.15); color: #38bdf8; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.25rem; color: #818cf8; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .btn { background: linear-gradient(135deg, #38bdf8, #818cf8); border: none; color: #0b0f19; font-weight: 700; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; transition: transform 0.2s; margin-right: 0.5rem; margin-top: 0.5rem; }
        .btn:hover { transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; }
        .log-box { font-family: 'Fira Code', monospace; background: #030712; border: 1px solid #1e293b; border-radius: 8px; padding: 1rem; font-size: 0.85rem; color: #a5f3fc; max-height: 180px; overflow-y: auto; white-space: pre-wrap; }
        .post-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-top: 0.75rem; }
        .badge-status { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .status-idle { background: #334155; color: #cbd5e1; }
        .status-loading { background: #d97706; color: #ffffff; }
        .status-succeeded { background: #059669; color: #ffffff; }
        .status-failed { background: #dc2626; color: #ffffff; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { createSlice, createAsyncThunk, configureStore } = window.RTK;
        const { Provider, useSelector, useDispatch } = window.ReactRedux;
        const { useState, useEffect } = React;

        // Custom Middleware for Action Logging
        let loggedActions = [];
        const actionLoggerMiddleware = storeAPI => next => action => {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ACTION: ${action.type}`;
            loggedActions = [logEntry, ...loggedActions.slice(0, 9)];
            return next(action);
        };

        // 1. Async Thunk for REST API integration
        const fetchPosts = createAsyncThunk(
            'posts/fetchPosts',
            async (limit = 3, { rejectWithValue }) => {
                try {
                    const res = await fetch(`https://jsonplaceholder.typicode.com/posts?_limit=${limit}`);
                    if (!res.ok) throw new Error('Failed to fetch posts');
                    return await res.json();
                } catch (err) {
                    return rejectWithValue(err.message);
                }
            }
        );

        // 2. Posts Slice with extraReducers builder
        const postsSlice = createSlice({
            name: 'posts',
            initialState: {
                items: [],
                status: 'idle', // idle | loading | succeeded | failed
                error: null
            },
            reducers: {
                clearPosts: (state) => {
                    state.items = [];
                    state.status = 'idle';
                    state.error = null;
                }
            },
            extraReducers: (builder) => {
                builder
                    .addCase(fetchPosts.pending, (state) => {
                        state.status = 'loading';
                        state.error = null;
                    })
                    .addCase(fetchPosts.fulfilled, (state, action) => {
                        state.status = 'succeeded';
                        state.items = action.payload;
                    })
                    .addCase(fetchPosts.rejected, (state, action) => {
                        state.status = 'failed';
                        state.error = action.payload || action.error.message;
                    });
            }
        });

        const { clearPosts } = postsSlice.actions;

        // 3. Configure Store with Middleware
        const store = configureStore({
            reducer: {
                posts: postsSlice.reducer
            },
            middleware: (getDefaultMiddleware) => 
                getDefaultMiddleware().concat(actionLoggerMiddleware)
        });

        // 4. Selectors
        const selectPosts = state => state.posts.items;
        const selectPostStatus = state => state.posts.status;
        const selectPostError = state => state.posts.error;

        function AsyncPostViewer() {
            const dispatch = useDispatch();
            const posts = useSelector(selectPosts);
            const status = useSelector(selectPostStatus);
            const error = useSelector(selectPostError);
            const [logs, setLogs] = useState([]);

            const refreshLogs = () => setLogs([...loggedActions]);

            const handleFetch = async () => {
                await dispatch(fetchPosts(3));
                refreshLogs();
            };

            const handleClear = () => {
                dispatch(clearPosts());
                refreshLogs();
            };

            return (
                <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', flexWrap: 'wrap' }}>
                        <button className="btn" onClick={handleFetch} disabled={status === 'loading'}>
                            {status === 'loading' ? 'Fetching REST API...' : 'Dispatch createAsyncThunk (Fetch)'}
                        </button>
                        <button className="btn btn-outline" onClick={handleClear}>Clear</button>
                        <span className={`badge-status status-${status}`}>Status: {status}</span>
                    </div>

                    {error && <div style={{ color: '#f43f5e', marginTop: '1rem' }}>Error: {error}</div>}

                    <div style={{ marginTop: '1.25rem' }}>
                        {posts.map(p => (
                            <div key={p.id} className="post-card">
                                <h4 style={{ color: '#38bdf8', fontSize: '0.95rem' }}>#{p.id}: {p.title}</h4>
                                <p style={{ color: '#94a3b8', fontSize: '0.85rem', marginTop: '0.25rem' }}>{p.body}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function MiddlewareLogViewer() {
            return (
                <div>
                    <div className="log-box">
                        {loggedActions.length > 0 ? loggedActions.join('\n') : '// Trigger an action above to see Redux middleware logging in real-time...'}
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <div className="container">
                    <header>
                        <span className="badge">Module 04</span>
                        <h1>Redux Selectors, Middleware &amp; Async Thunk</h1>
                        <p className="subtitle">Consuming external REST APIs with createAsyncThunk lifecycle and custom Redux Middleware interception.</p>
                    </header>

                    <div className="card">
                        <h2>1. Async API Integration (`createAsyncThunk`)</h2>
                        <AsyncPostViewer />
                    </div>

                    <div className="card">
                        <h2>2. Redux Custom Middleware Interception Log</h2>
                        <MiddlewareLogViewer />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <Provider store={store}>
                <App />
            </Provider>
        );
    </script>
</body>
</html>
