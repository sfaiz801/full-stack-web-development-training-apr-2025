<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 05: Client-Side Routing & Navigation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f8fafc; padding: 2.5rem 1rem; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
        header { text-align: center; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; background: rgba(56,189,248,0.15); color: #38bdf8; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.25rem; color: #818cf8; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        
        /* Router Nav Bar */
        .router-nav { display: flex; gap: 0.5rem; background: #0f172a; padding: 0.5rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 1.25rem; }
        .nav-link { padding: 0.5rem 1rem; border-radius: 6px; color: #94a3b8; text-decoration: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .nav-link:hover { color: #f8fafc; background: rgba(255,255,255,0.05); }
        .nav-link.active { background: #38bdf8; color: #0b0f19; }

        .route-view { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1.5rem; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .btn { background: linear-gradient(135deg, #38bdf8, #818cf8); border: none; color: #0b0f19; font-weight: 700; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin-top: 0.75rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Visual Client-Side SPA Routing Engine Simulator
        // Demonstrates routes, active links, params, and program navigation
        function HomePage() {
            return (
                <div className="route-view">
                    <h3 style={{ color: '#38bdf8' }}>🏠 Home Dashboard Overview</h3>
                    <p style={{ color: '#94a3b8', marginTop: '0.5rem' }}>
                        Welcome to the Client-Side Routing Architecture Showcase. SPAs update the view dynamically without full page reloads.
                    </p>
                </div>
            );
        }

        function CoursesPage({ onSelectCourse }) {
            const courses = [
                { id: 'react-19', title: 'Modern React 19 & Redux Toolkit', duration: '6 weeks' },
                { id: 'fastapi-cloud', title: 'FastAPI Microservices & AWS Cloud', duration: '8 weeks' },
                { id: 'nextjs-fullstack', title: 'Next.js 15 Full-Stack Architecture', duration: '6 weeks' }
            ];

            return (
                <div className="route-view">
                    <h3 style={{ color: '#38bdf8' }}>📚 Curriculum Catalog (/courses)</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', marginTop: '1rem' }}>
                        {courses.map(c => (
                            <div key={c.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#1e293b', padding: '0.75rem 1rem', borderRadius: '6px' }}>
                                <div>
                                    <strong style={{ color: '#f8fafc' }}>{c.title}</strong>
                                    <div style={{ fontSize: '0.8rem', color: '#94a3b8' }}>Duration: {c.duration}</div>
                                </div>
                                <button className="btn" onClick={() => onSelectCourse(c.id)}>View Details</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CourseDetail({ courseId, onBack }) {
            return (
                <div className="route-view">
                    <h3 style={{ color: '#34d399' }}>🔍 Route Dynamic Param: /courses/{courseId}</h3>
                    <p style={{ color: '#cbd5e1', marginTop: '0.5rem' }}>
                        Simulating <code>useParams()</code> hook extracting the parameter <code>{courseId}</code> from the URL.
                    </p>
                    <button className="btn" onClick={onBack}>← Back to Courses (useNavigate(-1))</button>
                </div>
            );
        }

        function AboutPage() {
            return (
                <div className="route-view">
                    <h3 style={{ color: '#818cf8' }}>ℹ️ About Student Career Journey</h3>
                    <p style={{ color: '#94a3b8', marginTop: '0.5rem' }}>
                        Designed for Mohammad Faiz's Full Stack Web Development portfolio at Indixpert.
                    </p>
                </div>
            );
        }

        function NotFoundPage({ onGoHome }) {
            return (
                <div className="route-view" style={{ borderColor: '#f43f5e' }}>
                    <h3 style={{ color: '#f43f5e' }}>⚠️ 404 Route Not Found</h3>
                    <p style={{ color: '#94a3b8', marginTop: '0.5rem' }}>The requested path does not exist in the route manifest.</p>
                    <button className="btn" onClick={onGoHome}>Go to Home</button>
                </div>
            );
        }

        function App() {
            const [currentPath, setCurrentPath] = useState('/');
            const [selectedCourse, setSelectedCourse] = useState(null);

            const navigate = (path) => {
                setSelectedCourse(null);
                setCurrentPath(path);
            };

            const handleCourseSelect = (id) => {
                setSelectedCourse(id);
                setCurrentPath(`/courses/${id}`);
            };

            return (
                <div className="container">
                    <header>
                        <span className="badge">Module 05</span>
                        <h1>Client-Side Routing &amp; Navigation</h1>
                        <p className="subtitle">Single Page Application (SPA) declarative routing, active navlinks, dynamic URL parameters, and fallback routes.</p>
                    </header>

                    <div className="card">
                        <h2>Active Route: <span style={{ color: '#38bdf8' }}>{currentPath}</span></h2>
                        
                        <div className="router-nav">
                            <span className={`nav-link ${currentPath === '/' ? 'active' : ''}`} onClick={() => navigate('/')}>Home</span>
                            <span className={`nav-link ${currentPath.startsWith('/courses') ? 'active' : ''}`} onClick={() => navigate('/courses')}>Courses</span>
                            <span className={`nav-link ${currentPath === '/about' ? 'active' : ''}`} onClick={() => navigate('/about')}>About</span>
                            <span className={`nav-link ${currentPath === '/unknown' ? 'active' : ''}`} onClick={() => navigate('/unknown')}>Test 404</span>
                        </div>

                        {currentPath === '/' && <HomePage />}
                        {currentPath === '/courses' && <CoursesPage onSelectCourse={handleCourseSelect} />}
                        {selectedCourse && <CourseDetail courseId={selectedCourse} onBack={() => navigate('/courses')} />}
                        {currentPath === '/about' && <AboutPage />}
                        {currentPath === '/unknown' && <NotFoundPage onGoHome={() => navigate('/')} />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
