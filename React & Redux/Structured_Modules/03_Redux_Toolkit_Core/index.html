<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 03: Redux Toolkit (RTK) Core Architecture</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <!-- React, ReactDOM, Redux, Redux-Toolkit, React-Redux, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@reduxjs/toolkit@1.9.5/dist/redux-toolkit.umd.js"></script>
    <script src="https://unpkg.com/react-redux@8.1.1/dist/react-redux.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f8fafc; padding: 2.5rem 1rem; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
        header { text-align: center; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; background: rgba(56,189,248,0.15); color: #38bdf8; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.25rem; color: #818cf8; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .btn { background: linear-gradient(135deg, #38bdf8, #818cf8); border: none; color: #0b0f19; font-weight: 700; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; transition: transform 0.2s; margin-right: 0.5rem; margin-top: 0.5rem; }
        .btn:hover { transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; }
        .btn-danger { background: linear-gradient(135deg, #f43f5e, #fb7185); color: white; }
        .state-viewer { font-family: 'Fira Code', monospace; background: #030712; border: 1px solid #1e293b; border-radius: 8px; padding: 1rem; font-size: 0.85rem; color: #a5f3fc; overflow-x: auto; }
        .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; margin-top: 0.5rem; }
        .todo-item.done span { text-decoration: line-through; color: #64748b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { createSlice, configureStore } = window.RTK;
        const { Provider, useSelector, useDispatch } = window.ReactRedux;
        const { useState } = React;

        // 1. Redux Toolkit Slice: Cart & Tasks
        const tasksSlice = createSlice({
            name: 'tasks',
            initialState: {
                items: [
                    { id: 1, title: 'Learn Redux Toolkit configureStore & createSlice', completed: true },
                    { id: 2, title: 'Understand Immer immutable updates under the hood', completed: false }
                ],
                totalCount: 2
            },
            reducers: {
                addTask: (state, action) => {
                    state.items.push({
                        id: Date.now(),
                        title: action.payload,
                        completed: false
                    });
                    state.totalCount = state.items.length;
                },
                toggleTask: (state, action) => {
                    const task = state.items.find(t => t.id === action.payload);
                    if (task) {
                        task.completed = !task.completed; // Direct mutation powered by Immer!
                    }
                },
                deleteTask: (state, action) => {
                    state.items = state.items.filter(t => t.id !== action.payload);
                    state.totalCount = state.items.length;
                }
            }
        });

        const { addTask, toggleTask, deleteTask } = tasksSlice.actions;

        // 2. Configure Store
        const store = configureStore({
            reducer: {
                tasks: tasksSlice.reducer
            }
        });

        // 3. Connected React Component
        function TaskManager() {
            const [inputText, setInputText] = useState('');
            const dispatch = useDispatch();
            const { items, totalCount } = useSelector(state => state.tasks);

            const handleAdd = () => {
                if (inputText.trim()) {
                    dispatch(addTask(inputText.trim()));
                    setInputText('');
                }
            };

            return (
                <div>
                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                        <input 
                            type="text" 
                            value={inputText}
                            onChange={(e) => setInputText(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleAdd()}
                            placeholder="Add new Redux task..."
                            style={{ flex: 1, background: '#0f172a', border: '1px solid #475569', color: '#f8fafc', padding: '0.6rem 1rem', borderRadius: '8px' }}
                        />
                        <button className="btn" onClick={handleAdd}>Dispatch Action</button>
                    </div>

                    <div style={{ marginTop: '1.25rem' }}>
                        <span style={{ fontSize: '0.85rem', color: '#94a3b8' }}>TOTAL MANAGED TASKS: <strong style={{ color: '#38bdf8' }}>{totalCount}</strong></span>
                        {items.map(t => (
                            <div key={t.id} className={`todo-item ${t.completed ? 'done' : ''}`}>
                                <span onClick={() => dispatch(toggleTask(t.id))} style={{ cursor: 'pointer' }}>
                                    {t.completed ? '✅' : '⏳'} {t.title}
                                </span>
                                <button className="btn btn-danger" style={{ margin: 0, padding: '0.3rem 0.6rem', fontSize: '0.8rem' }} onClick={() => dispatch(deleteTask(t.id))}>
                                    Delete
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // 4. Live Store Visualizer
        function StoreStateViewer() {
            const fullState = useSelector(state => state);
            return (
                <pre className="state-viewer">
                    {JSON.stringify(fullState, null, 2)}
                </pre>
            );
        }

        function App() {
            return (
                <div className="container">
                    <header>
                        <span className="badge">Module 03</span>
                        <h1>Redux Toolkit (RTK) Core Architecture</h1>
                        <p className="subtitle">Single Source of Truth, createSlice, configureStore, Immer-powered mutable draft updates, and actions.</p>
                    </header>

                    <div className="card">
                        <h2>1. Interactive Redux Task Manager</h2>
                        <TaskManager />
                    </div>

                    <div className="card">
                        <h2>2. Real-Time Redux Global Store Inspector</h2>
                        <StoreStateViewer />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <Provider store={store}>
                <App />
            </Provider>
        );
    </script>
</body>
</html>
