<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 06: React Performance Optimization & Scalability</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f8fafc; padding: 2.5rem 1rem; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
        header { text-align: center; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; background: rgba(56,189,248,0.15); color: #38bdf8; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.25rem; color: #818cf8; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .btn { background: linear-gradient(135deg, #38bdf8, #818cf8); border: none; color: #0b0f19; font-weight: 700; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; transition: transform 0.2s; margin-right: 0.5rem; margin-top: 0.5rem; }
        .btn:hover { transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; }
        .render-count { font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 9999px; background: rgba(52,211,153,0.2); color: #34d399; font-weight: 700; }
        .box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-top: 0.75rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useCallback, memo, useRef } = React;

        // 1. Memoized Child Component (React.memo)
        const ExpensiveChildWidget = memo(({ onAction, title }) => {
            const renderCount = useRef(1);
            renderCount.current += 1;

            return (
                <div className="box">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <strong style={{ color: '#38bdf8' }}>{title}</strong>
                        <span className="render-count">Child Render #{renderCount.current}</span>
                    </div>
                    <p style={{ color: '#94a3b8', fontSize: '0.85rem', marginTop: '0.25rem' }}>
                        This child only re-renders when its props change (protected by <code>React.memo</code> + <code>useCallback</code>).
                    </p>
                    <button className="btn btn-outline" onClick={onAction} style={{ fontSize: '0.8rem', padding: '0.3rem 0.7rem' }}>
                        Trigger Stable Action
                    </button>
                </div>
            );
        });

        // 2. Heavy calculation simulator
        function calculateFactorial(n) {
            let result = 1;
            for (let i = 1; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function App() {
            const [number, setNumber] = useState(10);
            const [parentCount, setParentCount] = useState(0);
            const [themeDark, setThemeDark] = useState(true);

            // useMemo: Only re-calculate factorial when 'number' changes, not on unrelated parent state updates
            const memoizedFactorial = useMemo(() => {
                return calculateFactorial(number);
            }, [number]);

            // useCallback: Returns memoized function reference so child doesn't re-render needlessly
            const stableCallback = useCallback(() => {
                alert(`Action triggered from memoized child with stable memory reference!`);
            }, []);

            return (
                <div className="container">
                    <header>
                        <span className="badge">Module 06</span>
                        <h1>React Performance Optimization &amp; Scalability</h1>
                        <p className="subtitle">Preventing unnecessary re-renders using React.memo, useCallback function stabilization, and useMemo computation caching.</p>
                    </header>

                    {/* 1. useMemo DEMO */}
                    <div className="card">
                        <h2>1. Computation Caching with `useMemo`</h2>
                        <p style={{ color: '#94a3b8', fontSize: '0.9rem' }}>
                            Factorial Calculation for <strong>{number}!</strong> = <span style={{ color: '#34d399', fontWeight: 'bold' }}>{memoizedFactorial.toLocaleString()}</span>
                        </p>
                        <div style={{ marginTop: '0.5rem' }}>
                            <button className="btn" onClick={() => setNumber(n => Math.min(20, n + 1))}>Increase Number (+1)</button>
                            <button className="btn btn-outline" onClick={() => setNumber(n => Math.max(1, n - 1))}>Decrease Number (-1)</button>
                        </div>
                    </div>

                    {/* 2. React.memo & useCallback DEMO */}
                    <div className="card">
                        <h2>2. Render Shielding (`React.memo` &amp; `useCallback`)</h2>
                        <p style={{ color: '#94a3b8', fontSize: '0.9rem' }}>
                            Clicking 'Trigger Parent Re-render' changes parent state, but <strong>does NOT</strong> re-render the child component because of <code>React.memo</code> and <code>useCallback</code>.
                        </p>
                        <div style={{ marginTop: '0.75rem' }}>
                            <button className="btn" onClick={() => setParentCount(c => c + 1)}>
                                Trigger Parent Re-render ({parentCount})
                            </button>
                        </div>

                        <ExpensiveChildWidget title="Protected Child Widget" onAction={stableCallback} />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
