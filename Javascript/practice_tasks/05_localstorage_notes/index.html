<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9 - LocalStorage Manager</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
        .container { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 500px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0b1120; color: #fff; }
        button { background: #6366f1; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background: #4f46e5; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.04); margin-bottom: 8px; border-radius: 8px; }
        .del-btn { background: #ef4444; color: white; padding: 4px 8px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
        .del-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    <h1 style="color: #818cf8;">Task 9: LocalStorage Notes Manager</h1>
    <p>Data persists automatically across page reloads using browser LocalStorage.</p>

    <div class="container">
        <div class="input-row">
            <input type="text" id="noteInput" placeholder="Enter quick note or link...">
            <button id="addBtn">Add Note</button>
        </div>
        <ul id="notesList"></ul>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
