<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 07: Asynchronous JavaScript, Promises & Fetch API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f8fafc; padding: 2.5rem 1rem; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
        header { text-align: center; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.75rem; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        h2 { font-size: 1.25rem; color: #818cf8; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }

        .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; }
        button {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            color: #0b0f19;
            font-weight: 700;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.btn-danger { background: linear-gradient(135deg, #f43f5e, #fb7185); color: white; }

        .status-box {
            font-family: 'Fira Code', monospace;
            background: #030712;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 1.25rem;
            font-size: 0.85rem;
            min-height: 120px;
            white-space: pre-wrap;
            color: #a5f3fc;
        }

        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 50%;
            border-top-color: #38bdf8;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span style="display:inline-block; padding:0.25rem 0.75rem; background:rgba(56,189,248,0.15); color:#38bdf8; border-radius:9999px; font-size:0.85rem; font-weight:600; margin-bottom:0.5rem;">Module 07</span>
            <h1>Asynchronous JavaScript, Promises &amp; APIs</h1>
            <p class="subtitle">Event loop dynamics, Promise chaining, modern async/await syntax, REST fetch, and robust try/catch error boundaries.</p>
        </header>

        <div class="card">
            <h2>Interactive Asynchronous Runner</h2>
            <div class="actions">
                <button id="btnFetchUsers">Fetch Users (Async/Await &amp; REST API)</button>
                <button id="btnPromiseAll">Promise.all() Parallel Execution</button>
                <button id="btnTriggerError" class="btn-danger">Simulate 404 Error Boundary</button>
            </div>

            <div class="status-box" id="outputConsole">// Click a button above to run asynchronous operations...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
